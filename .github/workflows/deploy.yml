name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestana Actions.
  workflow_dispatch:

# Permisos minimos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, se deja terminar el despliegue en curso
# y se encola el nuevo, en vez de cancelar a medias una publicacion.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y contenido
        run: npm run check

      - name: Construir el sitio
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
